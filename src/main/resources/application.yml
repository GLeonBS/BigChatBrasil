spring:
  application:
    name: big-chat-brasil
  datasource:
    url: jdbc:postgresql://postgres:5432/big_chat_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/master.xml
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080
  servlet:
    context-path: "/api"
  error:
    include-stacktrace: never

tarifa:
  mensagem:
    normal: 0.25
    prioritaria: 0.50

security:
  token:
    secret:
      cliente: "cliente_secret_prod"

